<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crew</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Ctext y=%2712.5%27 font-size=%2713%27%3E⚓%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script>try{var t=localStorage.getItem('crew-theme');var d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.className=d?'dark':'light'}catch(e){}</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="ws"><span class="logo">⚓</span><div><div class="ws-name">Crew</div><div id="project" class="ws-sub"></div></div></div>
    <button id="btnNew" class="side-item strong"><i data-i="plus"></i><span>New task</span></button>
    <div class="label">Team</div>
    <div id="roster"></div>
    <div class="label">Tasks</div>
    <div id="board" class="grow"></div>
    <div class="side-foot">
      <button id="btnLogin" class="side-item"><i data-i="key"></i><span id="loginLabel">Claude</span></button>
      <button id="btnLessons" class="side-item"><i data-i="book"></i><span>Lessons</span></button>
      <button id="btnSettings" class="side-item"><i data-i="sliders"></i><span>Settings</span></button>
      <button id="btnTheme" class="side-item"><i data-i="moon"></i><span id="themeLabel">Theme</span></button>
    </div>
  </aside>
  <main id="center">
    <header class="top">
      <nav id="tabs" class="seg"></nav>
      <div class="grow"></div>
      <span id="headState" class="badge"></span>
      <button id="stop" type="button" class="btn secondary sm" hidden><i data-i="square"></i>Stop</button>
    </header>
    <div id="banner" class="banner" hidden></div>
    <div id="chat"></div>
    <form id="composer" class="promptbar">
      <textarea id="input" rows="1" placeholder="Message…"></textarea>
      <div class="pb-row"><span class="hint">Enter to send · Shift+Enter for newline</span><button id="send" class="send" title="Send"><i data-i="up"></i></button></div>
    </form>
  </main>
  <aside id="right" hidden></aside>
</div>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script src="app.js" type="module"></script>
</body>
</html>
